version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    container_name: hirewise_mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: hirewise

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: hirewise_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - MONGO_URL=mongodb://mongodb:27017
      - DB_NAME=hirewise
    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
    command: >
      sh -c "python ml/train.py && uvicorn main:app --host 0.0.0.0 --port 8000 --reload"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: hirewise_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  mongo_data:
